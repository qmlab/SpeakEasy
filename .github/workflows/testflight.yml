name: TestFlight Deploy
# Auto-build and deploy Rising Star Kid to TestFlight
on:
  push:
    branches: [main]
    paths:
      - 'SpeakEasy/**'
      - 'SpeakEasyTests/**'
      - 'SpeakEasy.xcodeproj/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

jobs:
  deploy-testflight:
    runs-on: macos-26
    if: github.ref == 'refs/heads/main'
    env:
      SCHEME: SpeakEasy
      BUNDLE_ID: com.mmff.speakeasy

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "## TestFlight Deploy Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Missing required secrets. Add APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, and APPLE_PROVISIONING_PROFILE_BASE64." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PP_UUID"

      - name: Verify signing identity
        run: |
          echo "Available signing identities:"
          security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db
          echo ""
          echo "Provisioning profile details:"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/$PROVISIONING_PROFILE_UUID.mobileprovision 2>/dev/null | head -80

      - name: Set build number
        run: |
          # Offset so builds are above the previous high-water mark (build 14).
          # run 17 → 21, 18 → 22, … — always monotonically increasing.
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))
          echo "Setting CFBundleVersion to $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" SpeakEasy/Info.plist
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Archive app
        run: |
          xcodebuild archive \
            -project SpeakEasy.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SpeakEasy.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0"
          echo "Archive created successfully (build $BUILD_NUMBER)"

      - name: Create ExportOptions.plist
        run: |
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>$TEAM_ID</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>provisioningProfiles</key>
          <dict>
          <key>$BUNDLE_ID</key>
          <string>$PROVISIONING_PROFILE_UUID</string>
          </dict>
          <key>uploadBitcode</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
          </dict>
          </plist>
          EOF
          # Strip leading whitespace from heredoc lines
          sed -i '' 's/^[[:space:]]*//' $RUNNER_TEMP/ExportOptions.plist
          echo "ExportOptions.plist created:"
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SpeakEasy.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            | xcpretty
          echo "IPA exported successfully"
          ls -lh $RUNNER_TEMP/export/
          # Save IPA path for subsequent steps
          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: RisingStarKid-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          uses-non-exempt-encryption: 'false'

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
