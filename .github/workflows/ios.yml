name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'SpeakEasy/**'
      - 'SpeakEasyTests/**'
      - 'SpeakEasy.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SpeakEasy/**'
      - 'SpeakEasyTests/**'
      - 'SpeakEasy.xcodeproj/**'
      - '.github/workflows/ios.yml'

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      SCHEME: SpeakEasy
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'

    steps:
      - uses: actions/checkout@v4

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Build
        run: |
          xcodebuild build \
            -project SpeakEasy.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Run tests
        run: |
          xcodebuild test \
            -project SpeakEasy.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
