name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'SpeakEasy/**'
      - 'SpeakEasyTests/**'
      - 'SpeakEasy.xcodeproj/**'
      - '.github/workflows/ios.yml'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - 'SpeakEasy/**'
      - 'SpeakEasyTests/**'
      - 'SpeakEasy.xcodeproj/**'
      - '.github/workflows/ios.yml'
      - '.gitattributes'

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      SCHEME: SpeakEasy
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17,OS=latest'

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpeakEasy.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpeakEasy.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Zip simulator .app
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH"
            ls -la build/Build/Products/Debug-iphonesimulator/ || true
            exit 1
          fi
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/RisingStarKid.zip" "$SCHEME.app"
          echo "Zipped .app: $(du -h "$GITHUB_WORKSPACE/RisingStarKid.zip" | cut -f1)"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v5
        with:
          name: RisingStarKid-Simulator
          path: RisingStarKid.zip
          retention-days: 30

      # --- Deploy to Appetize ---
      - name: Deploy to Appetize
        continue-on-error: true
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "## Appetize Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable auto-deploy to Appetize, add \`APPETIZE_API_TOKEN\` to your repository secrets." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to **Settings → Secrets and variables → Actions**" >> $GITHUB_STEP_SUMMARY
            echo "2. Click **New repository secret**" >> $GITHUB_STEP_SUMMARY
            echo "3. Name: \`APPETIZE_API_TOKEN\`, Value: your Appetize API token" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "Appetize deployment skipped - APPETIZE_API_TOKEN secret not configured."
            echo "The .app artifact is still available for manual download above."
            exit 0
          fi
          echo "Uploading to Appetize..."

          # Check if we already have an app (stored as a secret or variable)
          PUBLIC_KEY="${{ vars.APPETIZE_PUBLIC_KEY }}"

          upload_to_appetize() {
            local METHOD=$1
            local URL=$2
            curl -s -w "\n%{http_code}" \
              -X "$METHOD" \
              -H "X-API-KEY: $APPETIZE_API_TOKEN" \
              -F "file=@RisingStarKid.zip" \
              -F "platform=ios" \
              -F "note=Rising Star Kid - Build from commit ${{ github.sha }}" \
              "$URL"
          }

          if [ -n "$PUBLIC_KEY" ]; then
            echo "Updating existing app with public key: $PUBLIC_KEY"
            RESPONSE=$(upload_to_appetize PUT "https://api.appetize.io/v1/apps/$PUBLIC_KEY")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            # Fall back to creating a new app if update fails (e.g. wrong public key)
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "Update failed with HTTP $HTTP_CODE, falling back to create new app..."
              echo "$BODY"
              RESPONSE=$(upload_to_appetize POST "https://api.appetize.io/v1/apps")
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')
            fi
          else
            echo "No public key configured, creating new app..."
            RESPONSE=$(upload_to_appetize POST "https://api.appetize.io/v1/apps")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            APP_PUBLIC_KEY=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['publicKey'])")
            echo "## Appetize Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Public Key:** \`$APP_PUBLIC_KEY\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Preview URL:** https://appetize.io/app/$APP_PUBLIC_KEY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Open the link above to test Rising Star Kid in your browser!" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "Appetize app deployed successfully!"
            echo "Preview URL: https://appetize.io/app/$APP_PUBLIC_KEY"
          else
            echo "Appetize upload failed with HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
