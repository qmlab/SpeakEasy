[tool.poetry]
name = "risingstar-backend"
version = "0.1.0"
description = "Backend API for Rising Star Kid - Adaptive learning platform for children with autism"
authors = ["Rising Star Kid Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.128.0"}
uvicorn = "^0.40.0"
sqlalchemy = "^2.0.45"
pydantic = "^2.12.5"
python-multipart = "^0.0.21"
aiofiles = "^25.1.0"
levenshtein = "^0.27.3"
requests = "^2.32.5"
cloudinary = "^1.44.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
