<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Table -->
  <ellipse cx="50" cy="55" rx="40" ry="15" fill="#8D6E63"/>
  <!-- Dominant speaker (standing/bigger) -->
  <circle cx="50" cy="22" r="12" fill="#FFCC80"/>
  <ellipse cx="50" cy="28" rx="4" ry="3" fill="#333"/>
  <!-- Speech lines -->
  <line x1="38" y1="15" x2="32" y2="10" stroke="#FF9800" stroke-width="1.5"/>
  <line x1="62" y1="15" x2="68" y2="10" stroke="#FF9800" stroke-width="1.5"/>
  <!-- Quiet listeners -->
  <circle cx="20" cy="50" r="8" fill="#FFCC80"/>
  <circle cx="80" cy="50" r="8" fill="#FFCC80"/>
  <circle cx="35" cy="65" r="7" fill="#FFCC80"/>
  <circle cx="65" cy="65" r="7" fill="#FFCC80"/>
</svg>