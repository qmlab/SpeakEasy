<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FCE4EC" rx="10"/>
  <!-- Calendar -->
  <rect x="20" y="15" width="60" height="50" rx="5" fill="white" stroke="#C62828" stroke-width="2"/>
  <rect x="20" y="15" width="60" height="15" rx="5" fill="#C62828"/>
  <text x="50" y="27" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">CALENDAR</text>
  <!-- Saturday circled by Emma -->
  <text x="33" y="48" font-family="Arial" font-size="8" fill="#333">SAT</text>
  <circle cx="33" cy="45" r="10" fill="none" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="3"/>
  <!-- Sunday is actual day -->
  <text x="58" y="48" font-family="Arial" font-size="8" fill="#333">SUN</text>
  <circle cx="58" cy="45" r="10" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <!-- Party icon -->
  <text x="50" y="82" text-anchor="middle" font-family="Arial" font-size="14">🎉</text>
</svg>