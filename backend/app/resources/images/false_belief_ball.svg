<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E8F5E9" rx="10"/>
  <!-- Basket -->
  <path d="M10 60 L18 85 L42 85 L50 60 Z" fill="#D7A86E" stroke="#8D6E63" stroke-width="2"/>
  <!-- Box -->
  <rect x="58" y="60" width="32" height="25" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
