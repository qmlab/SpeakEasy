  <!-- Labels -->
  <text x="30" y="95" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Basket</text>
  <text x="74" y="95" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Box</text>
</svg>