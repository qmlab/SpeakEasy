<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<circle cx="60" cy="60" r="56" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3"/>
<!-- Needle body - angled for visibility -->
<path d="M42 18 L46 18 L64 96 L60 96Z" fill="#B0BEC5"/>
<path d="M43 20 L45 20 L62 92 L60 92Z" fill="#CFD8DC" opacity="0.5"/>
