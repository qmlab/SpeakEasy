<ellipse cx="44" cy="26" rx="3" ry="5" fill="#F3E5F5" stroke="#78909C" stroke-width="1.5"/>
<!-- Thread through eye -->
<path d="M30 20 Q38 18 44 22 Q48 25 44 30 Q40 34 36 30" fill="none" stroke="#E91E63" stroke-width="2" stroke-linecap="round"/>
<path d="M36 30 Q32 28 28 32 Q24 38 20 42" fill="none" stroke="#E91E63" stroke-width="2" stroke-linecap="round"/>
<!-- Needle shine line -->
<path d="M43 22 L61 94" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>
<!-- Shadow -->
<path d="M46 20 L66 98" fill="none" stroke="#78909C" stroke-width="0.5" opacity="0.3"/>
</svg>