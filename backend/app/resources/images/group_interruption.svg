<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Group discussion -->
  <circle cx="25" cy="45" r="10" fill="#FFCC80"/>
  <circle cx="75" cy="45" r="10" fill="#FFCC80"/>
  <!-- Interrupter -->
  <circle cx="50" cy="35" r="12" fill="#FFCC80"/>
  <ellipse cx="50" cy="42" rx="4" ry="3" fill="#333"/>
  <!-- Multiple speech bubbles (interrupting) -->
  <ellipse cx="50" cy="18" rx="18" ry="8" fill="white" stroke="#F44336" stroke-width="1.5"/>
  <text x="50" y="21" text-anchor="middle" font-family="Arial" font-size="8" fill="#F44336">Me! Me!</text>
</svg>