<rect x="86" y="49" width="5" height="8" rx="1" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
<rect x="78" y="49" width="5" height="10" rx="1" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
