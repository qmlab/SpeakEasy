<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#EFEBE9" rx="10"/>
  <!-- Books on shelf -->
  <rect x="10" y="15" width="12" height="30" fill="#F44336"/>
  <rect x="24" y="18" width="10" height="27" fill="#2196F3"/>
  <rect x="36" y="15" width="14" height="30" fill="#4CAF50"/>
  <rect x="52" y="20" width="11" height="25" fill="#FF9800"/>
  <line x1="5" y1="45" x2="70" y2="45" stroke="#8D6E63" stroke-width="2"/>
  <!-- Phone ringing -->
  <rect x="60" y="55" width="20" height="30" rx="4" fill="#333"/>
  <rect x="63" y="58" width="14" height="20" rx="2" fill="#42A5F5"/>
  <!-- Ring waves -->
  <path d="M85 55 Q90 50 88 45" stroke="#FF9800" stroke-width="2" fill="none"/>
  <path d="M88 58 Q95 50 92 42" stroke="#FF9800" stroke-width="2" fill="none"/>
  <!-- Quiet sign -->
  <text x="30" y="72" text-anchor="middle" font-family="Arial" font-size="12" fill="#C62828">Shhh!</text>
</svg>