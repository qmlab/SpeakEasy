<rect x="50" y="20" width="20" height="45" rx="4" fill="#A1887F"/>
<rect x="52" y="22" width="16" height="41" rx="3" fill="#8D6E63"/>
<!-- Wood grain on handle -->
<path d="M55 25 L55 60" fill="none" stroke="#795548" stroke-width="0.8" opacity="0.5"/>
<path d="M60 24 L60 62" fill="none" stroke="#795548" stroke-width="0.5" opacity="0.4"/>
<path d="M65 25 L65 60" fill="none" stroke="#795548" stroke-width="0.8" opacity="0.5"/>
<!-- Handle highlight -->
<rect x="54" y="24" width="4" height="38" rx="2" fill="#BCAAA4" opacity="0.4"/>
