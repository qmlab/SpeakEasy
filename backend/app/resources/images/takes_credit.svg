<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Lightbulb (idea) -->
  <circle cx="50" cy="20" r="12" fill="#FFD700" stroke="#F57F17" stroke-width="1.5"/>
  <rect x="46" y="32" width="8" height="5" rx="2" fill="#F57F17"/>
  <!-- Arrow from idea to wrong person -->
  <path d="M50 37 L70 50" stroke="#F44336" stroke-width="2"/>
  <polygon points="68,47 74,50 68,53" fill="#F44336"/>
  <!-- Person taking credit -->
  <circle cx="72" cy="62" r="10" fill="#FFCC80"/>
  <path d="M68 65 Q72 68 76 65" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- You (original idea person) -->
  <circle cx="28" cy="62" r="10" fill="#FFCC80"/>
  <circle cx="24" cy="60" r="2" fill="#333"/>
  <circle cx="32" cy="60" r="2" fill="#333"/>
  <path d="M24 66 Q28 63 32 66" stroke="#333" stroke-width="1.5" fill="none"/>
</svg>