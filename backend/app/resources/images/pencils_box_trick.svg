<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FFF8E1" rx="10"/>
  <!-- Box with "Pencils" label -->
  <rect x="20" y="25" width="60" height="40" rx="5" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="42" text-anchor="middle" font-family="Arial" font-size="11" fill="#1565C0">Pencils</text>
  <!-- Candies peeking out -->
  <circle cx="35" cy="55" r="5" fill="#F44336"/>
  <circle cx="50" cy="58" r="5" fill="#4CAF50"/>
  <circle cx="65" cy="55" r="5" fill="#FFD700"/>
  <!-- Question mark -->
  <text x="50" y="82" text-anchor="middle" font-family="Arial" font-size="20" fill="#E67E22">?</text>
</svg>