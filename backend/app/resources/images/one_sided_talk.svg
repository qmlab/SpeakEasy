<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E8F5E9" rx="10"/>
  <!-- Enthusiastic speaker -->
  <circle cx="30" cy="40" r="12" fill="#FFCC80"/>
  <circle cx="26" cy="38" r="2" fill="#333"/>
  <circle cx="34" cy="38" r="2" fill="#333"/>
  <path d="M26 43 Q30 47 34 43" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Long detailed speech -->
  <rect x="45" y="12" width="45" height="35" rx="5" fill="white" stroke="#CCC" stroke-width="1"/>
  <line x1="50" y1="20" x2="85" y2="20" stroke="#BBB" stroke-width="1"/>
  <line x1="50" y1="25" x2="85" y2="25" stroke="#BBB" stroke-width="1"/>
  <line x1="50" y1="30" x2="85" y2="30" stroke="#BBB" stroke-width="1"/>
  <line x1="50" y1="35" x2="80" y2="35" stroke="#BBB" stroke-width="1"/>
  <line x1="50" y1="40" x2="75" y2="40" stroke="#BBB" stroke-width="1"/>
  <!-- Uncomfortable listener -->
  <circle cx="70" cy="65" r="12" fill="#FFCC80"/>
  <circle cx="66" cy="63" r="2" fill="#333"/>
  <circle cx="74" cy="63" r="2" fill="#333"/>
  <path d="M66 70 Q70 67 74 70" stroke="#333" stroke-width="1.5" fill="none"/>
</svg>