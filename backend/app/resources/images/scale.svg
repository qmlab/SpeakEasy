<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<circle cx="60" cy="60" r="56" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<!-- Base -->
<rect x="40" y="88" width="40" height="6" rx="2" fill="#795548"/>
<!-- Pillar -->
<rect x="57" y="38" width="6" height="52" rx="2" fill="#8D6E63"/>
<!-- Top pivot -->
<circle cx="60" cy="38" r="5" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
<!-- Beam - tilted slightly -->
<rect x="15" y="36" width="90" height="5" rx="2" fill="#A1887F" transform="rotate(-5 60 38)"/>
<!-- Left pan strings -->
<line x1="22" y1="38" x2="18" y2="60" stroke="#9E9E9E" stroke-width="1.5"/>
<line x1="22" y1="38" x2="30" y2="60" stroke="#9E9E9E" stroke-width="1.5"/>
<!-- Right pan strings -->
<line x1="98" y1="33" x2="92" y2="52" stroke="#9E9E9E" stroke-width="1.5"/>
<line x1="98" y1="33" x2="104" y2="52" stroke="#9E9E9E" stroke-width="1.5"/>
<!-- Left pan (lower = heavier) -->
<path d="M10 60 Q12 66 24 66 Q36 66 38 60Z" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
<!-- Right pan (higher = lighter) -->
<path d="M84 52 Q86 58 98 58 Q110 58 112 52Z" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
<!-- Weight on left pan -->
<rect x="18" y="56" width="12" height="8" rx="2" fill="#1565C0"/>
<!-- Small item on right pan -->
<circle cx="98" cy="50" r="4" fill="#E53935"/>
</svg>