<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Child sitting properly -->
  <circle cx="50" cy="35" r="14" fill="#FFCC80"/>
  <circle cx="44" cy="32" r="2.5" fill="#333"/>
  <circle cx="56" cy="32" r="2.5" fill="#333"/>
  <line x1="44" y1="40" x2="56" y2="40" stroke="#333" stroke-width="1.5"/>
  <!-- Correct answers -->
  <text x="72" y="25" font-family="Arial" font-size="12" fill="#4CAF50">✓</text>
  <text x="78" y="38" font-family="Arial" font-size="12" fill="#4CAF50">✓</text>
  <text x="72" y="50" font-family="Arial" font-size="12" fill="#4CAF50">✓</text>
  <!-- Empty speech bubble (no initiation) -->
  <ellipse cx="30" cy="22" rx="15" ry="8" fill="white" stroke="#CCC" stroke-width="1" stroke-dasharray="3"/>
  <text x="30" y="25" text-anchor="middle" font-family="Arial" font-size="8" fill="#CCC">...</text>
</svg>