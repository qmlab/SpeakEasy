<rect x="85" y="28" width="5" height="68" rx="2" fill="#6D4C41"/>
<!-- Backrest -->
<rect x="30" y="26" width="60" height="6" rx="3" fill="#8D6E63"/>
<rect x="30" y="26" width="60" height="4" rx="2" fill="#A1887F" opacity="0.5"/>
<!-- Backrest vertical slats -->
<rect x="40" y="32" width="5" height="26" rx="2" fill="#795548"/>
<rect x="52" y="32" width="5" height="26" rx="2" fill="#795548"/>
<rect x="64" y="32" width="5" height="26" rx="2" fill="#795548"/>
<rect x="76" y="32" width="5" height="26" rx="2" fill="#795548"/>
<!-- Slat highlights -->
<rect x="41" y="33" width="2" height="24" rx="1" fill="#8D6E63" opacity="0.4"/>
<rect x="53" y="33" width="2" height="24" rx="1" fill="#8D6E63" opacity="0.4"/>
<rect x="65" y="33" width="2" height="24" rx="1" fill="#8D6E63" opacity="0.4"/>
<rect x="77" y="33" width="2" height="24" rx="1" fill="#8D6E63" opacity="0.4"/>
<!-- Seat -->
<rect x="28" y="56" width="64" height="8" rx="3" fill="#A1887F"/>
<rect x="30" y="56" width="60" height="6" rx="2" fill="#BCAAA4"/>
<!-- Seat front edge highlight -->
<path d="M30 62 L88 62" fill="none" stroke="#8D6E63" stroke-width="1"/>
<!-- Front legs -->
<rect x="30" y="62" width="5" height="32" rx="2" fill="#795548"/>
<rect x="85" y="62" width="5" height="32" rx="2" fill="#795548"/>
<!-- Leg highlights -->
<rect x="31" y="64" width="2" height="28" rx="1" fill="#8D6E63" opacity="0.3"/>
<rect x="86" y="64" width="2" height="28" rx="1" fill="#8D6E63" opacity="0.3"/>
<!-- Cross brace between front legs -->
