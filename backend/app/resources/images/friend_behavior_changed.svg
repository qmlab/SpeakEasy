<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Before (happy) -->
  <circle cx="25" cy="35" r="12" fill="#FFCC80"/>
  <path d="M21 38 Q25 42 29 38" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="25" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#4CAF50">Before</text>
  <!-- Arrow -->
  <path d="M42 35 L58 35" stroke="#666" stroke-width="2"/>
  <polygon points="58,32 62,35 58,38" fill="#666"/>
  <!-- After (withdrawn) -->
  <circle cx="75" cy="35" r="12" fill="#FFCC80"/>
  <path d="M71 40 Q75 37 79 40" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="75" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#F44336">After</text>
  <!-- Worried observer -->
  <circle cx="50" cy="75" r="10" fill="#FFCC80"/>
  <text x="50" y="92" text-anchor="middle" font-family="Arial" font-size="8" fill="#FF9800">Worried</text>
</svg>