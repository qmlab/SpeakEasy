<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<circle cx="60" cy="60" r="56" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
<!-- Body - streamlined fish shape -->
<path d="M16 58 Q16 42 40 36 Q62 32 82 40 Q96 48 96 58 Q96 68 82 74 Q62 80 40 76 Q16 72 16 58Z" fill="#EF9A9A"/>
<!-- Back darker band -->
<path d="M20 52 Q22 42 42 36 Q62 32 82 40 Q94 46 96 54" fill="none" stroke="#E57373" stroke-width="3" opacity="0.5"/>
<!-- Belly lighter -->
<path d="M20 62 Q30 72 50 74 Q70 76 88 68 Q78 76 50 78 Q28 76 20 66Z" fill="#FFCDD2"/>
<!-- Silver shimmer on side -->
<ellipse cx="55" cy="56" rx="20" ry="8" fill="#FFEBEE" opacity="0.4"/>
<!-- Head -->
<path d="M16 58 Q12 52 16 48" fill="none" stroke="#E57373" stroke-width="1.5"/>
<!-- Eye -->
<circle cx="24" cy="50" r="5" fill="white" stroke="#E57373" stroke-width="0.5"/>
<circle cx="25" cy="50" r="3" fill="#263238"/>
<circle cx="24" cy="49" r="1.2" fill="white"/>
<!-- Mouth -->
<path d="M14 56 Q16 58 14 60" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round"/>
<!-- Gill slit -->
<path d="M30 46 Q28 54 30 64" fill="none" stroke="#E57373" stroke-width="1.5" opacity="0.6"/>
<!-- Dorsal fin -->
<path d="M52 36 Q50 22 58 24 Q56 28 56 36Z" fill="#E57373"/>
<path d="M54 26 Q56 24 58 26" fill="none" stroke="#EF9A9A" stroke-width="0.5"/>
<!-- Adipose fin (small fin near tail - characteristic of salmon) -->
<path d="M76 40 Q76 36 80 38 Q78 40 78 42Z" fill="#E57373" opacity="0.7"/>
<!-- Anal fin -->
<path d="M68 74 Q66 82 72 80 Q70 76 70 74Z" fill="#E57373"/>
<!-- Pectoral fin -->
<path d="M34 62 Q30 70 28 74 Q32 70 36 64Z" fill="#E57373"/>
<!-- Pelvic fin -->
<path d="M52 72 Q50 78 54 76 Q52 74 52 72Z" fill="#E57373"/>
<!-- Tail fin - forked -->
<path d="M94 52 L108 38 Q112 34 110 40 L102 52" fill="#E57373"/>
<path d="M94 62 L108 76 Q112 80 110 74 L102 64" fill="#E57373"/>
<!-- Tail base narrowing -->
<path d="M90 52 L94 56 L90 60" fill="none" stroke="#E57373" stroke-width="1" opacity="0.3"/>
<!-- Dark spots (characteristic of salmon) -->
<circle cx="36" cy="48" r="2" fill="#C62828" opacity="0.35"/>
<circle cx="46" cy="44" r="1.8" fill="#C62828" opacity="0.3"/>
<circle cx="56" cy="46" r="2.2" fill="#C62828" opacity="0.3"/>
<circle cx="66" cy="44" r="1.5" fill="#C62828" opacity="0.25"/>
<circle cx="42" cy="54" r="1.5" fill="#C62828" opacity="0.2"/>
<circle cx="54" cy="52" r="1.8" fill="#C62828" opacity="0.2"/>
<circle cx="72" cy="48" r="1.5" fill="#C62828" opacity="0.25"/>
<!-- Scale pattern hints -->
<path d="M38 56 Q40 54 42 56 Q44 54 46 56" fill="none" stroke="#E57373" stroke-width="0.7" opacity="0.3"/>
<path d="M50 56 Q52 54 54 56 Q56 54 58 56" fill="none" stroke="#E57373" stroke-width="0.7" opacity="0.3"/>
<path d="M62 56 Q64 54 66 56 Q68 54 70 56" fill="none" stroke="#E57373" stroke-width="0.7" opacity="0.3"/>
<path d="M44 62 Q46 60 48 62 Q50 60 52 62" fill="none" stroke="#E57373" stroke-width="0.5" opacity="0.2"/>
<path d="M56 62 Q58 60 60 62 Q62 60 64 62" fill="none" stroke="#E57373" stroke-width="0.5" opacity="0.2"/>
<!-- Lateral line -->
<path d="M32 56 Q50 54 70 56 Q82 58 90 56" fill="none" stroke="#C62828" stroke-width="0.6" opacity="0.2"/>
</svg>
