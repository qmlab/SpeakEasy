<path d="M60 26 C66 20 74 18 80 20" fill="none" stroke="#2E7D32" stroke-width="0.8"/>
<path d="M62 24 L72 20 M64 25 L70 22" fill="none" stroke="#388E3C" stroke-width="0.5" opacity="0.6"/>
<!-- Leaf left (smaller) -->
