<!-- Center crease line -->
<path d="M60 42 Q59 60 60 94" fill="none" stroke="#C62828" stroke-width="0.8" opacity="0.3"/>
<!-- Stem -->
<path d="M60 38 Q59 30 57 22" fill="none" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
<path d="M59 38 Q58 30 56.5 23" fill="none" stroke="#795548" stroke-width="1.5" stroke-linecap="round"/>
