<path d="M40 54 Q42 52 44 54 Q46 52 48 54" fill="none" stroke="#388E3C" stroke-width="0.8" opacity="0.35"/>
<path d="M52 54 Q54 52 56 54 Q58 52 60 54" fill="none" stroke="#388E3C" stroke-width="0.8" opacity="0.35"/>
<path d="M64 54 Q66 52 68 54 Q70 52 72 54" fill="none" stroke="#388E3C" stroke-width="0.8" opacity="0.35"/>
<path d="M44 60 Q46 58 48 60 Q50 58 52 60" fill="none" stroke="#388E3C" stroke-width="0.6" opacity="0.25"/>
<path d="M58 60 Q60 58 62 60 Q64 58 66 60" fill="none" stroke="#388E3C" stroke-width="0.6" opacity="0.25"/>
