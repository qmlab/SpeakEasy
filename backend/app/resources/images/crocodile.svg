<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<circle cx="60" cy="60" r="56" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<!-- Body - long and low -->
<path d="M22 56 Q22 46 38 44 L82 44 Q96 44 98 54 Q98 64 82 66 L38 66 Q22 66 22 56Z" fill="#4CAF50"/>
<!-- Belly lighter -->
<path d="M26 58 Q26 64 38 66 L82 66 Q94 64 96 58" fill="#81C784" opacity="0.5"/>
<!-- Snout - long jaws -->
<path d="M22 52 L6 48 Q2 50 2 54 Q2 58 6 58 L22 58Z" fill="#66BB6A"/>
<!-- Upper jaw detail -->
<path d="M6 48 L22 52" fill="none" stroke="#43A047" stroke-width="1.5"/>
<!-- Lower jaw -->
<path d="M6 58 L22 58" fill="none" stroke="#388E3C" stroke-width="1.5"/>
<!-- Teeth - upper jaw zigzag -->
<path d="M6 52 L8 50 L10 52 L12 50 L14 52 L16 50 L18 52 L20 50 L22 52" fill="none" stroke="white" stroke-width="1.8"/>
<!-- Teeth - lower jaw zigzag -->
<path d="M6 56 L8 58 L10 56 L12 58 L14 56 L16 58 L18 56 L20 58" fill="none" stroke="#F5F5F5" stroke-width="1.5"/>
<!-- Eye bumps raised above head -->
<ellipse cx="26" cy="42" rx="6" ry="5" fill="#4CAF50" stroke="#388E3C" stroke-width="1"/>
<!-- Eye -->
<circle cx="26" cy="42" r="4" fill="#FDD835"/>
<ellipse cx="27" cy="42" rx="1.8" ry="3" fill="black"/>
<circle cx="26" cy="41" r="0.8" fill="white" opacity="0.6"/>
<!-- Second eye (far side, partially visible) -->
<ellipse cx="30" cy="43" rx="3" ry="3" fill="#4CAF50"/>
<!-- Dorsal ridges / scutes -->
<path d="M36 44 L38 36 L40 44" fill="#388E3C"/>
<path d="M44 44 L46 37 L48 44" fill="#388E3C"/>
<path d="M52 44 L54 37 L56 44" fill="#388E3C"/>
<path d="M60 44 L62 38 L64 44" fill="#388E3C"/>
<path d="M68 44 L70 38 L72 44" fill="#388E3C"/>
<path d="M76 44 L78 39 L80 44" fill="#388E3C"/>
<!-- Tail - tapered and curving -->
<path d="M98 54 Q102 52 106 56 Q110 60 108 66 Q106 70 102 72 Q98 74 96 70 Q98 66 100 62 Q100 58 98 56Z" fill="#4CAF50"/>
<path d="M106 56 Q108 60 106 66" fill="none" stroke="#388E3C" stroke-width="1" opacity="0.5"/>
<!-- Front legs with toes -->
<path d="M36 66 L32 76 M32 76 L28 80 M32 76 L32 82 M32 76 L36 80" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
<!-- Back legs with toes -->
<path d="M78 66 L82 76 M82 76 L86 80 M82 76 L82 82 M82 76 L78 80" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
