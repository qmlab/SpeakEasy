<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FFF3E0" rx="10"/>
  <!-- Two whispering people -->
  <circle cx="25" cy="35" r="12" fill="#FFCC80"/>
  <circle cx="50" cy="35" r="12" fill="#FFCC80"/>
  <!-- Whispering hand gesture -->
  <path d="M37 35 Q42 30 45 35" stroke="#DEB887" stroke-width="3" fill="none"/>
  <!-- Third person walking by, looking sad -->
  <circle cx="78" cy="38" r="12" fill="#FFCC80"/>
  <circle cx="74" cy="36" r="2" fill="#333"/>
  <circle cx="82" cy="36" r="2" fill="#333"/>
  <path d="M74 44 Q78 40 82 44" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Dotted separation -->
  <line x1="65" y1="20" x2="65" y2="80" stroke="#CCC" stroke-width="1" stroke-dasharray="4"/>
</svg>