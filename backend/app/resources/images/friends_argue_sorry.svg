<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E8F5E9" rx="10"/>
  <!-- Friend 1 (apologizing) -->
  <circle cx="30" cy="40" r="12" fill="#FFCC80"/>
  <circle cx="26" cy="38" r="2" fill="#333"/>
  <circle cx="34" cy="38" r="2" fill="#333"/>
  <path d="M26 44 Q30 41 34 44" stroke="#333" stroke-width="1.5" fill="none"/>
  <text x="30" y="62" text-anchor="middle" font-family="Arial" font-size="8" fill="#4CAF50">Sorry</text>
  <!-- Friend 2 (receiving apology) -->
  <circle cx="70" cy="40" r="12" fill="#FFCC80"/>
  <circle cx="66" cy="38" r="2" fill="#333"/>
  <circle cx="74" cy="38" r="2" fill="#333"/>
  <text x="70" y="62" text-anchor="middle" font-family="Arial" font-size="8" fill="#FF9800">...</text>
  <!-- Peace/reconciliation -->
  <path d="M42 40 L58 40" stroke="#4CAF50" stroke-width="2" stroke-dasharray="3"/>
</svg>