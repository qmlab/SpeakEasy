<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FFF3E0" rx="10"/>
  <!-- Self-focused talker -->
  <circle cx="35" cy="40" r="14" fill="#FFCC80"/>
  <ellipse cx="35" cy="47" rx="4" ry="3" fill="#333"/>
  <!-- Many speech bubbles from them -->
  <ellipse cx="25" cy="15" rx="12" ry="6" fill="white" stroke="#CCC" stroke-width="1"/>
  <text x="25" y="17" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">me me</text>
  <ellipse cx="50" cy="10" rx="10" ry="5" fill="white" stroke="#CCC" stroke-width="1"/>
  <text x="50" y="12" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">I did</text>
  <!-- Bored listener -->
  <circle cx="70" cy="42" r="14" fill="#FFCC80"/>
  <path d="M63 38 Q67 36 71 38" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M77 38 Q73 36 79 38" stroke="#333" stroke-width="1.5" fill="none"/>
  <line x1="64" y1="48" x2="76" y2="48" stroke="#333" stroke-width="1.5"/>
</svg>