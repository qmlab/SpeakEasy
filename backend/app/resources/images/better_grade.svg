  <!-- You with lower grade -->
  <rect x="15" y="20" width="30" height="38" fill="white" stroke="#CCC" stroke-width="1"/>
  <text x="30" y="45" text-anchor="middle" font-family="Arial" font-size="18" fill="#FF9800" font-weight="bold">B</text>
  <circle cx="30" cy="72" r="12" fill="#FFCC80"/>
  <path d="M24 76 Q30 72 36 76" stroke="#333" stroke-width="1.5" fill="none"/>
