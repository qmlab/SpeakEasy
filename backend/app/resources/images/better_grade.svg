<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E3F2FD" rx="10"/>
  <!-- Paper with A+ -->
  <rect x="55" y="20" width="30" height="38" fill="white" stroke="#CCC" stroke-width="1"/>
  <text x="70" y="45" text-anchor="middle" font-family="Arial" font-size="18" fill="#4CAF50" font-weight="bold">A+</text>
  <!-- Happy classmate -->
  <circle cx="70" cy="72" r="12" fill="#FFCC80"/>
