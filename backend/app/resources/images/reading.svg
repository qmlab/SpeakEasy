<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Child reading a book -->
  <!-- Body sitting -->
  <rect x="70" y="110" width="60" height="50" rx="8" fill="#5B9BD5"/>
  <!-- Legs -->
  <rect x="75" y="155" width="20" height="30" rx="6" fill="#4472C4"/>
  <rect x="105" y="155" width="20" height="30" rx="6" fill="#4472C4"/>
  <!-- Shoes -->
  <ellipse cx="85" cy="187" rx="14" ry="6" fill="#333"/>
  <ellipse cx="115" cy="187" rx="14" ry="6" fill="#333"/>
  <!-- Head -->
  <circle cx="100" cy="75" r="28" fill="#FFDAB9"/>
  <!-- Hair -->
  <path d="M72 65 Q72 45 100 42 Q128 45 128 65" fill="#8B4513"/>
  <rect x="72" y="55" width="56" height="12" rx="4" fill="#8B4513"/>
  <!-- Eyes -->
  <circle cx="90" cy="72" r="3" fill="#333"/>
  <circle cx="110" cy="72" r="3" fill="#333"/>
  <!-- Eye whites -->
  <circle cx="91" cy="71" r="1" fill="white"/>
  <circle cx="111" cy="71" r="1" fill="white"/>
  <!-- Mouth (slight smile) -->
  <path d="M93 82 Q100 88 107 82" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="77" rx="2" ry="2.5" fill="#E8C4A0"/>
  <!-- Arms holding book -->
  <path d="M70 120 Q55 130 60 145" fill="none" stroke="#5B9BD5" stroke-width="12" stroke-linecap="round"/>
  <path d="M130 120 Q145 130 140 145" fill="none" stroke="#5B9BD5" stroke-width="12" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="60" cy="145" r="6" fill="#FFDAB9"/>
  <circle cx="140" cy="145" r="6" fill="#FFDAB9"/>
  <!-- Open book -->
  <rect x="55" y="125" width="40" height="30" rx="2" fill="#FFF8DC" stroke="#D4A574" stroke-width="1"/>
  <rect x="95" y="125" width="40" height="30" rx="2" fill="#FFFACD" stroke="#D4A574" stroke-width="1"/>
  <!-- Book spine -->
  <line x1="95" y1="123" x2="95" y2="157" stroke="#8B6914" stroke-width="2"/>
  <!-- Text lines on left page -->
  <line x1="60" y1="132" x2="88" y2="132" stroke="#CCC" stroke-width="1.5"/>
  <line x1="60" y1="137" x2="85" y2="137" stroke="#CCC" stroke-width="1.5"/>
  <line x1="60" y1="142" x2="87" y2="142" stroke="#CCC" stroke-width="1.5"/>
  <line x1="60" y1="147" x2="82" y2="147" stroke="#CCC" stroke-width="1.5"/>
  <!-- Text lines on right page -->
  <line x1="100" y1="132" x2="130" y2="132" stroke="#CCC" stroke-width="1.5"/>
  <line x1="100" y1="137" x2="127" y2="137" stroke="#CCC" stroke-width="1.5"/>
  <line x1="100" y1="142" x2="129" y2="142" stroke="#CCC" stroke-width="1.5"/>
  <line x1="100" y1="147" x2="125" y2="147" stroke="#CCC" stroke-width="1.5"/>
</svg>
